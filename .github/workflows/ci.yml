name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_iso:
        description: 'Build ISO artifact'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: wrexros-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Show versions
        run: node --version && npm --version
      - name: Validate unattended examples
        run: |
          for f in installer/examples/*.json; do
            echo "Validating $f"
            node installer/validate-config.mjs "$f"
          done
      - name: Backend tests
        run: node --experimental-strip-types --test core/tests/*.test.ts
      - name: CLI tests
        run: node --experimental-strip-types --test cli/tests/*.test.ts
      - name: Build web UI
        run: node web/build.mjs
      - name: Shell syntax check
        run: |
          for f in installer/*.sh installer/functions/*.sh boot/*.sh packaging/*.sh updater/*.sh \
                   packaging/live-build/includes.chroot/usr/local/bin/wrexr-live-install; do
            bash -n "$f"
          done
      - name: Verify release version consistency
        run: node scripts/check-release-consistency.mjs
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build-iso:
    name: Build installable ISO
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      - name: Build ISO in container
        run: |
          set -o pipefail
          mkdir -p out
          if ! docker build --progress=plain -t wrexros-iso-builder -f packaging/Dockerfile . \
              2>&1 | tee /tmp/wrexr-docker-build.log; then
            echo "::error::Docker image build failed; last lines:"
            tail -n 80 /tmp/wrexr-docker-build.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          fi
          if ! docker run --rm --privileged \
              -v "$PWD/out":/build/out \
              -e WREXR_VERSION="$(cat VERSION)" \
              wrexros-iso-builder 2>&1 | tee /tmp/wrexr-docker-run.log; then
            echo "::error::ISO build container failed; last lines:"
            tail -n 120 /tmp/wrexr-docker-run.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          fi
      - name: Download web UI build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build code bundle for in-place updater
        run: |
          VERSION="$(cat VERSION)"
          stage="$(mktemp -d)"
          mkdir -p "$stage/WrexrOS-${VERSION}"
          tar --exclude=./.git --exclude=./out --exclude=./node_modules \
              --exclude=./packaging/build -cf - . \
            | tar -xf - -C "$stage/WrexrOS-${VERSION}"
          tar -czf "out/WrexrOS-${VERSION}-linux-amd64.tar.gz" \
              -C "$stage" "WrexrOS-${VERSION}"
          rm -rf "$stage"
      - name: Generate checksums
        run: |
          cd out
          # The container writes SHA256SUMS as root; remove it before regenerating.
          sudo rm -f SHA256SUMS
          sha256sum *.iso *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrexros-iso
          path: out/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [test, build-iso]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wrexros-iso
          path: out
      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-consistency.mjs
      - name: Verify checksums
        run: cd out && sha256sum -c SHA256SUMS
      - name: Sign release assets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No signing key configured; publishing unsigned assets."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd out
          for f in *.iso *.tar.gz SHA256SUMS; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.tar.gz
            out/*.asc
            out/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload ISO to Proxmox
        env:
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_ISO_DIR: ${{ secrets.PROXMOX_ISO_DIR }}
          PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
        run: |
          if [ -z "${PROXMOX_HOST:-}" ] || [ -z "${PROXMOX_USER:-}" ] || \
             [ -z "${PROXMOX_ISO_DIR:-}" ] || [ -z "${PROXMOX_SSH_KEY:-}" ]; then
            echo "Proxmox deployment secrets are not configured; skipping ISO upload."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROXMOX_SSH_KEY" > "$HOME/.ssh/wrexros-deploy"
          chmod 600 "$HOME/.ssh/wrexros-deploy"
          ssh-keyscan -H "$PROXMOX_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          VERSION="$(cat VERSION)"
          ISO="out/WrexrOS-${VERSION}-amd64.iso"
          test -f "$ISO"
          SSH="ssh -i $HOME/.ssh/wrexros-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          $SSH "$PROXMOX_USER@$PROXMOX_HOST" "mkdir -p -- '$PROXMOX_ISO_DIR'"
          scp -i "$HOME/.ssh/wrexros-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ISO" "$PROXMOX_USER@$PROXMOX_HOST:$PROXMOX_ISO_DIR/"
          $SSH "$PROXMOX_USER@$PROXMOX_HOST" \
            "cd '$PROXMOX_ISO_DIR' && sha256sum 'WrexrOS-${VERSION}-amd64.iso' && ls -lh 'WrexrOS-${VERSION}-amd64.iso'"
