<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1440" height="900" fill="#0d1116"/><rect width="236" height="900" fill="#10161d"/>
  <text x="28" y="52" fill="#e6edf3" font-size="19" font-weight="700">WrexrOS</text>
  <text x="28" y="70" fill="#8b9bab" font-size="10" letter-spacing="2">HYPERVISOR OS</text>
  <rect x="16" y="378" width="204" height="40" rx="8" fill="#1b242e"/>
  <text x="54" y="404" fill="#2dd4bf" font-size="14" font-weight="600">⚙  Settings</text>
  <g fill="#8b9bab" font-size="14"><text x="54" y="174">▦  Dashboard</text><text x="54" y="220">▣  Virtual Machines</text><text x="54" y="266">◈  Storage</text><text x="54" y="312">▧  File Shares</text><text x="54" y="358">⬡  Docker Apps</text></g>
  <text x="272" y="46" fill="#e6edf3" font-size="22" font-weight="650">Settings</text>
  <text x="272" y="66" fill="#8b9bab" font-size="12">Appliance configuration · changes are audited</text>

  <g font-size="12">
    <rect x="272" y="88" width="130" height="34" rx="8" fill="#1b242e" stroke="#27323d"/><text x="337" y="110" text-anchor="middle" fill="#e6edf3">General</text>
    <rect x="410" y="88" width="130" height="34" rx="8" fill="#2dd4bf"/><text x="475" y="110" text-anchor="middle" fill="#06231f" font-weight="700">Network</text>
    <rect x="548" y="88" width="130" height="34" rx="8" fill="#1b242e" stroke="#27323d"/><text x="613" y="110" text-anchor="middle" fill="#e6edf3">Storage</text>
    <rect x="686" y="88" width="170" height="34" rx="8" fill="#1b242e" stroke="#27323d"/><text x="771" y="110" text-anchor="middle" fill="#e6edf3">Users &amp; access</text>
    <rect x="864" y="88" width="130" height="34" rx="8" fill="#1b242e" stroke="#27323d"/><text x="929" y="110" text-anchor="middle" fill="#e6edf3">Updates</text>
    <rect x="1002" y="88" width="150" height="34" rx="8" fill="#1b242e" stroke="#27323d"/><text x="1077" y="110" text-anchor="middle" fill="#e6edf3">Advanced</text>
  </g>

  <rect x="272" y="144" width="700" height="330" rx="12" fill="#151c24" stroke="#27323d"/>
  <text x="296" y="176" fill="#e6edf3" font-size="14" font-weight="650">Interfaces &amp; bridges</text>
  <g font-size="12" fill="#e6edf3"><text x="296" y="212">eno1</text><text x="296" y="250">eno2</text><text x="296" y="288">vmbr0</text><text x="296" y="326">vmbr1</text></g>
  <g font-size="11" fill="#8b9bab"><text x="400" y="212">DHCP · 192.168.1.24/24</text><text x="400" y="250">unassigned</text><text x="400" y="288">VLAN-unaware · eno1</text><text x="400" y="326">VLAN-aware 10-30 · eno2</text></g>
  <g fill="#3ecf8e" font-size="10"><text x="800" y="212">● UP</text><text x="800" y="288">● UP</text><text x="800" y="326">● UP</text></g>
  <text x="296" y="382" fill="#8b9bab" font-size="11">DNS: 1.1.1.1, 9.9.9.9 · Search: wrexr.local · Proxy: (none)</text>
  <rect x="296" y="410" width="130" height="32" rx="7" fill="#2dd4bf"/><text x="361" y="431" text-anchor="middle" fill="#06231f" font-size="11" font-weight="700">Apply network</text>
  <rect x="436" y="410" width="110" height="32" rx="7" fill="#1b242e" stroke="#27323d"/><text x="491" y="431" text-anchor="middle" fill="#e6edf3" font-size="11">Dry run</text>

  <rect x="988" y="144" width="414" height="330" rx="12" fill="#151c24" stroke="#27323d"/>
  <text x="1010" y="176" fill="#e6edf3" font-size="14" font-weight="650">Firewall &amp; remote access</text>
  <g font-size="11" fill="#8b9bab"><text x="1010" y="210">Default policy</text><text x="1340" y="210" text-anchor="end">DROP</text>
  <text x="1010" y="240">Management UI</text><text x="1340" y="240" text-anchor="end">ALLOW 8443/tcp</text>
  <text x="1010" y="270">SSH</text><text x="1340" y="270" text-anchor="end">ALLOW 22/tcp</text>
  <text x="1010" y="300">Reverse proxy</text><text x="1340" y="300" text-anchor="end">enabled</text>
  <text x="1010" y="330">Let's Encrypt</text><text x="1340" y="330" text-anchor="end">pending renewal</text>
  <text x="1010" y="360">Secure remote</text><text x="1340" y="360" text-anchor="end">disabled</text></g>
  <rect x="1010" y="388" width="160" height="30" rx="7" fill="#1b242e" stroke="#27323d"/><text x="1090" y="408" text-anchor="middle" fill="#e6edf3" font-size="11">+ Add rule</text>

  <rect x="272" y="494" width="1130" height="368" rx="12" fill="#151c24" stroke="#27323d"/>
  <text x="296" y="524" fill="#e6edf3" font-size="14" font-weight="650">Raw config editor</text>
  <text x="1290" y="524" fill="#8b9bab" font-size="11" text-anchor="end">/etc/wrexr/wrexrd.toml</text>
  <rect x="296" y="540" width="1082" height="258" rx="8" fill="#0b1015" stroke="#27323d"/>
  <g font-family="Consolas, monospace" font-size="12" fill="#8b9bab">
    <text x="312" y="566">1</text><text x="312" y="590">2</text><text x="312" y="614">3</text><text x="312" y="638">4</text><text x="312" y="662">5</text><text x="312" y="686">6</text><text x="312" y="710">7</text><text x="312" y="734">8</text>
  </g>
  <g font-family="Consolas, monospace" font-size="12" fill="#e6edf3">
    <text x="340" y="566">[daemon]</text>
    <text x="340" y="590">port = 8443</text>
    <text x="340" y="614">tls = true</text>
    <text x="340" y="638">state_dir = "/var/lib/wrexr"</text>
    <text x="340" y="662">channel = "stable"</text>
    <text x="340" y="686">repo = "https://github.com/nikolajalbrechtsen/WrexrOS.git"</text>
    <text x="340" y="710">[network]</text>
    <text x="340" y="734">bridge = "vmbr0"</text>
  </g>
  <g font-size="11"><rect x="296" y="812" width="120" height="30" rx="7" fill="#1b242e" stroke="#27323d"/><text x="356" y="832" text-anchor="middle" fill="#e6edf3">Validate</text>
  <rect x="426" y="812" width="120" height="30" rx="7" fill="#2dd4bf"/><text x="486" y="832" text-anchor="middle" fill="#06231f" font-weight="700">Save</text>
  <text x="570" y="832" fill="#3ecf8e">● Valid · backup created before save</text></g>
</svg>
