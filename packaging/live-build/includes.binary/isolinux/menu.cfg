# WrexrOS isolinux menu (installed as isolinux/menu.cfg in the ISO).
# Every entry states its install mode explicitly; an empty value disables the
# live installer autostart hook.
UI menu.c32
PROMPT 0
TIMEOUT 80
DEFAULT standard
MENU TITLE WrexrOS - Debian-based hypervisor / NAS appliance

LABEL standard
  MENU LABEL WrexrOS - Standard install
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash wrexr.install=standard

LABEL advanced
  MENU LABEL WrexrOS - Advanced install
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash wrexr.install=advanced

LABEL unattended
  MENU LABEL WrexrOS - Unattended install (autospec.json)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash wrexr.install=unattended wrexr.config=/run/live/medium/wrexr/autospec.json

LABEL rescue
  MENU LABEL Rescue shell (live root, no install)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components rescue quiet wrexr.install=

LABEL existing
  MENU LABEL Live shell (no installer autostart)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet wrexr.install=

LABEL live
  MENU LABEL Try WrexrOS without installing
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash wrexr.install=

MENU SEPARATOR
LABEL help
  MENU LABEL Hardware requirements: 2+ GiB RAM, 32+ GiB system disk, EFI or BIOS
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash wrexr.install=
  TEXT HELP
    Management UI after install: https://<management-ip>:8443/
    Installer: sudo /opt/wrexr/installer/wrexr-installer.sh --interactive
  ENDTEXT
