# WrexrOS GRUB boot menu (used when live-build emits a grub-pc image).
# An empty wrexr.install= disables the live installer autostart hook.
set default=0
set timeout=8
set timeout_style=menu

search --set=root --file /live/vmlinuz

menuentry "WrexrOS - Standard install" {
  linux /live/vmlinuz boot=live components quiet splash wrexr.install=standard
  initrd /live/initrd.img
}

menuentry "WrexrOS - Advanced install" {
  linux /live/vmlinuz boot=live components quiet splash wrexr.install=advanced
  initrd /live/initrd.img
}

menuentry "WrexrOS - Unattended install (autospec.json)" {
  linux /live/vmlinuz boot=live components quiet splash wrexr.install=unattended wrexr.config=/run/live/medium/wrexr/autospec.json
  initrd /live/initrd.img
}

menuentry "Rescue shell (live root, no install)" {
  linux /live/vmlinuz boot=live components rescue quiet wrexr.install=
  initrd /live/initrd.img
}

menuentry "Live shell (no installer autostart)" {
  linux /live/vmlinuz boot=live components quiet wrexr.install=
  initrd /live/initrd.img
}

menuentry "Try WrexrOS without installing" {
  linux /live/vmlinuz boot=live components quiet splash wrexr.install=
  initrd /live/initrd.img
}

menuentry "Help / hardware requirements" {
  linux /live/vmlinuz boot=live components quiet splash wrexr.install=
  initrd /live/initrd.img
}
