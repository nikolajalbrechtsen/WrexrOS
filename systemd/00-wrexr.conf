# /etc/sudoers.d/00-wrexr.conf - minimal, no-shell-escape helper policy for the
# unprivileged 'wrexr' service account. Install with mode 0440 and verify with
# `visudo -cf /etc/sudoers.d/00-wrexr.conf` before enabling wrexrd.service.
#
# NOEXEC is applied to every alias below: helper binaries must not be able to
# spawn a shell. Argument patterns only match safe characters (no spaces, no
# metacharacters), and each command is an explicit allow-list.

# --- virtual machines -----------------------------------------------------------
Cmnd_Alias WREXR_VIRSH = \
    /usr/bin/virsh list, /usr/bin/virsh dominfo [A-Za-z0-9_.-]*, \
    /usr/bin/virsh dumpxml [A-Za-z0-9_.-]*, /usr/bin/virsh domblklist [A-Za-z0-9_.-]*, \
    /usr/bin/virsh domifaddr [A-Za-z0-9_.-]*, \
    /usr/bin/virsh start [A-Za-z0-9_.-]*, /usr/bin/virsh shutdown [A-Za-z0-9_.-]*, \
    /usr/bin/virsh reboot [A-Za-z0-9_.-]*, /usr/bin/virsh destroy [A-Za-z0-9_.-]*, \
    /usr/bin/virsh suspend [A-Za-z0-9_.-]*, /usr/bin/virsh resume [A-Za-z0-9_.-]*, \
    /usr/bin/virsh snapshot-list [A-Za-z0-9_.-]*, \
    /usr/bin/virsh snapshot-create-as [A-Za-z0-9_.-]* [A-Za-z0-9_.-]*, \
    /usr/bin/virsh snapshot-delete [A-Za-z0-9_.-]* [A-Za-z0-9_.-]*

# --- containers / Docker app store ---------------------------------------------
Cmnd_Alias WREXR_DOCKER = \
    /usr/bin/docker ps, /usr/bin/docker ps -a, /usr/bin/docker images, \
    /usr/bin/docker pull [A-Za-z0-9.:/_-]*, \
    /usr/bin/docker inspect [A-Za-z0-9_.-]*, /usr/bin/docker logs [A-Za-z0-9_.-]*, \
    /usr/bin/docker start [A-Za-z0-9_.-]*, /usr/bin/docker stop [A-Za-z0-9_.-]*, \
    /usr/bin/docker restart [A-Za-z0-9_.-]*, /usr/bin/docker rm [A-Za-z0-9_.-]*

# --- file sharing ---------------------------------------------------------------
Cmnd_Alias WREXR_SAMBA = \
    /usr/bin/smbpasswd -a [A-Za-z0-9_.-]*, \
    /usr/bin/smbpasswd -e [A-Za-z0-9_.-]*, \
    /usr/bin/smbpasswd -d [A-Za-z0-9_.-]*, \
    /usr/bin/testparm, /usr/bin/pdbedit -L

# --- ZFS / storage --------------------------------------------------------------
# Deliberately no zpool destroy / zfs destroy: destructive storage actions go
# through the audited API after an explicit confirmation step.
Cmnd_Alias WREXR_ZPOOL = \
    /usr/sbin/zpool list, /usr/sbin/zpool status, \
    /usr/sbin/zpool scrub [A-Za-z0-9_-]*, \
    /usr/sbin/zpool clear [A-Za-z0-9_-]*, \
    /usr/sbin/zpool upgrade -v
Cmnd_Alias WREXR_ZFS = \
    /usr/sbin/zfs list, /usr/sbin/zfs get [A-Za-z0-9_,:.-]* [A-Za-z0-9_/.-]*, \
    /usr/sbin/zfs set [A-Za-z0-9_,:.-]+=[A-Za-z0-9_,:.-]* [A-Za-z0-9_/.-]*, \
    /usr/sbin/zfs snapshot [A-Za-z0-9_/.-]+@[A-Za-z0-9_.-]*

# --- disk health and network inspection ----------------------------------------
Cmnd_Alias WREXR_SMART = \
    /usr/sbin/smartctl -a /dev/[A-Za-z0-9_]*, \
    /usr/sbin/smartctl -H /dev/[A-Za-z0-9_]*, \
    /usr/sbin/smartctl -t short /dev/[A-Za-z0-9_]*, \
    /usr/sbin/smartctl -t long /dev/[A-Za-z0-9_]*
Cmnd_Alias WREXR_IP = \
    /usr/bin/ip addr, /usr/bin/ip -4 addr, /usr/bin/ip route, \
    /usr/bin/ip -4 route, /usr/bin/ip link, /usr/bin/ip addr show, \
    /usr/bin/ip -4 addr show, /usr/bin/ip route show

# --- named services only --------------------------------------------------------
Cmnd_Alias WREXR_SYSTEMCTL = \
    /usr/bin/systemctl status wrexrd.service, \
    /usr/bin/systemctl status wrexr-updater.timer, \
    /usr/bin/systemctl restart wrexrd.service, \
    /usr/bin/systemctl restart wrexr-updater.timer, \
    /usr/bin/systemctl enable wrexr-kiosk.service, \
    /usr/bin/systemctl disable wrexr-kiosk.service, \
    /usr/bin/systemctl start wrexr-kiosk.service, \
    /usr/bin/systemctl stop wrexr-kiosk.service, \
    /usr/bin/systemctl reload smbd.service, \
    /usr/bin/systemctl reload nmbd.service, \
    /usr/bin/systemctl restart smbd.service, \
    /usr/bin/systemctl restart docker.service, \
    /usr/bin/systemctl status libvirtd.service, \
    /usr/bin/systemctl restart libvirtd.service, \
    /usr/bin/systemctl restart nftables.service

# Apply NOEXEC to each alias so a compromised helper cannot launch a shell.
Defaults!WREXR_VIRSH noexec
Defaults!WREXR_DOCKER noexec
Defaults!WREXR_SAMBA noexec
Defaults!WREXR_ZPOOL noexec
Defaults!WREXR_ZFS noexec
Defaults!WREXR_SMART noexec
Defaults!WREXR_IP noexec
Defaults!WREXR_SYSTEMCTL noexec

wrexr ALL=(root) NOPASSWD: NOEXEC: \
    WREXR_VIRSH, WREXR_DOCKER, WREXR_SAMBA, WREXR_ZPOOL, WREXR_ZFS, \
    WREXR_SMART, WREXR_IP, WREXR_SYSTEMCTL
